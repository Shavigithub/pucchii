<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pucchii ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    text-align: center;
    position: relative;
    color: white;
}

/* ⭐ Stars */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

/* 🌙 Moon */
.moon {
    position: absolute;
    top: 60px;
    right: 100px;
    width: 130px;
    height: 130px;
    background: radial-gradient(circle at 30% 30%, #fff, #f0f0f0 60%, #dcdcdc 100%);
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(255,255,255,0.7);
    animation: moonGlow 4s ease-in-out infinite alternate;
    z-index: 1;
}
@keyframes moonGlow {
    from { box-shadow: 0 0 40px rgba(255,255,255,0.5); }
    to { box-shadow: 0 0 120px rgba(255,255,255,0.9); }
}

/* ☁️ Clouds */
.cloud {
    position: absolute;
    top: 90px;
    width: 200px;
    height: 60px;
    background: rgba(255,255,255,0.15);
    border-radius: 50px;
    filter: blur(8px);
    animation: moveClouds 30s linear infinite;
    z-index: 2;
}
@keyframes moveClouds {
    from { transform: translateX(-300px); }
    to { transform: translateX(120vw); }
}

/* 💖 Card */
.card {
    position: relative;
    z-index: 3;
    background: rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(255,255,255,0.2);
    max-width: 550px;
    animation: fadeIn 2s ease-in-out;
}

h1 {
    font-size: 2.5em;
    text-shadow: 0 0 20px #ff4da6;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: #ff4da6;
    color: white;
    font-size: 16px;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.1);
}

.promise {
    margin-top: 20px;
    display: none;
    font-size: 1.2em;
    color: #ffb6f9;
}

/* 🎵 Music Button */
.music-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(255,255,255,0.2);
    border: none;
    padding: 10px 15px;
    border-radius: 50px;
    cursor: pointer;
    color: white;
    font-size: 14px;
    backdrop-filter: blur(5px);
}

/* 💋 Kiss Burst */
.kiss {
    position: absolute;
    font-size: 28px;
    animation: kissBurst 2s ease-out forwards;
}
@keyframes kissBurst {
    0% { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<!-- 🌙 Moon -->
<div class="moon"></div>

<!-- ☁️ Clouds -->
<div class="cloud" style="animation-delay:0s;"></div>
<div class="cloud" style="animation-delay:15s;"></div>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>I'm Sorry, Pucchii ❤️🌙</h1>
    <p>
        My Dearest Pucchii 💖,<br><br>
        Under this glowing moon 🌙 and endless stars ✨  
        My love for you shines forever ♾️.  
        I am truly sorry 😔💔.  
        You are my moon, my stars, my everything 💞.
    </p>

    <button onclick="showPromise()">Please Forgive Me 💕</button>

    <div class="promise" id="promise">
        I will love you beyond the stars 🌠💗  
        — Yours forever, Rakesh 💖💋
    </div>

<!-- 🎵 Music Control -->
<button class="music-btn" onclick="toggleMusic()">🎵 Pause</button>

<script>
const music = document.getElementById("bgMusic");
const musicBtn = document.querySelector(".music-btn");

/* Smooth fade-in */
function fadeInMusic() {
    music.volume = 0;
    music.play().then(() => {
        let vol = 0;
        const fade = setInterval(() => {
            if (vol < 0.5) {
                vol += 0.02;
                music.volume = vol;
            } else {
                clearInterval(fade);
            }
        }, 200);
    }).catch(()=>{});
}

/* Try autoplay */
window.addEventListener("load", fadeInMusic);

/* Fallback on first click */
document.addEventListener("click", function() {
    if (music.paused) fadeInMusic();
}, { once: true });

/* Play/Pause Toggle */
function toggleMusic() {
    if (music.paused) {
        music.play();
        musicBtn.innerHTML = "🎵 Pause";
    } else {
        music.pause();
        musicBtn.innerHTML = "🎵 Play";
    }
}

/* Promise + Kiss */
function showPromise() {
    const promise = document.getElementById("promise");
    promise.style.display = "block";

    const rect = promise.getBoundingClientRect();
    for (let i = 0; i < 15; i++) {
        const kiss = document.createElement("div");
        kiss.classList.add("kiss");
        kiss.innerHTML = "💋";
        kiss.style.left = rect.left + rect.width/2 + "px";
        kiss.style.top = rect.top + rect.height/2 + "px";
        kiss.style.setProperty("--x", (Math.random()-0.5)*400+"px");
        kiss.style.setProperty("--y", (Math.random()-0.5)*400+"px");
        document.body.appendChild(kiss);
        setTimeout(()=>kiss.remove(),2000);
    }
}

/* Stars */
for (let i = 0; i < 100; i++) {
    const star = document.createElement("div");
    star.classList.add("star");
    star.style.top = Math.random()*100+"vh";
    star.style.left = Math.random()*100+"vw";
    document.body.appendChild(star);
}
</script>

</body>
</html>
